services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: crm_e2e
      POSTGRES_USER: e2e
      POSTGRES_PASSWORD: e2e
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U e2e -d crm_e2e']
      interval: 2s
      timeout: 3s
      retries: 20
