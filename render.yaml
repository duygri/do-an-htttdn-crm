services:
  - type: web
    name: anh-lon-crm-demo
    runtime: docker
    plan: free
    autoDeployTrigger: 'off'
    healthCheckPath: /healthz
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: PUBLIC_ORIGIN
        sync: false
