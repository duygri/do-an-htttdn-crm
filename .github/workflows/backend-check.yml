name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect changed domains
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            # Workflow-file changes intentionally fan out all domains.
            backend:
              - 'backend/**'
              - 'database/**'
              - 'tests/**'
              - '.github/workflows/**'
            frontend:
              - 'frontend/**'
              - '.github/workflows/**'
            # Docs/Markdown changes intentionally run the full PlantUML corpus lint.
            docs:
              - 'docs/**'
              - '**/*.md'
              - '.github/workflows/**'

  be-check:
    name: BE / tests & build
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend == 'true'
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and test backend
        working-directory: backend
        run: mvn -B -ntp verify

  fe-check:
    name: FE / build & lint
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.frontend == 'true'
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Node.js 22
        if: hashFiles('frontend/package.json') != '' && hashFiles('frontend/package-lock.json') != ''
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Require frontend lockfile
        if: hashFiles('frontend/package.json') != ''
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f package-lock.json ]]; then
            echo "frontend/package.json exists but frontend/package-lock.json is absent; commit the lockfile and use npm ci." >&2
            exit 1
          fi

      - name: Install frontend dependencies from lockfile
        if: hashFiles('frontend/package.json') != '' && hashFiles('frontend/package-lock.json') != ''
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        if: hashFiles('frontend/package.json') != ''
        working-directory: frontend
        run: |
          node - lint <<'NODE'
          const fs = require('node:fs');
          const { spawnSync } = require('node:child_process');

          const script = process.argv[2];
          const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          if (!Object.prototype.hasOwnProperty.call(packageJson.scripts ?? {}, script)) {
            console.log(`${script} not configured; skipped`);
            process.exit(0);
          }

          const result = spawnSync('npm', ['run', script], { stdio: 'inherit' });
          process.exit(result.status ?? 1);
          NODE

      - name: Type-check frontend
        if: hashFiles('frontend/package.json') != ''
        working-directory: frontend
        run: |
          node - typecheck <<'NODE'
          const fs = require('node:fs');
          const { spawnSync } = require('node:child_process');

          const script = process.argv[2];
          const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          if (!Object.prototype.hasOwnProperty.call(packageJson.scripts ?? {}, script)) {
            console.log(`${script} not configured; skipped`);
            process.exit(0);
          }

          const result = spawnSync('npm', ['run', script], { stdio: 'inherit' });
          process.exit(result.status ?? 1);
          NODE

      - name: Build frontend
        if: hashFiles('frontend/package.json') != ''
        working-directory: frontend
        run: npm run build

      - name: Validate frontend placeholder
        if: hashFiles('frontend/package.json') == ''
        shell: bash
        run: |
          set -euo pipefail
          test -f frontend/README.md
          test -d frontend/src
          echo "Frontend toolchain is not present; placeholder README and src directory are valid."

  docs-check:
    name: Docs / lint
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.docs == 'true'
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check changed-file whitespace
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --check "$PR_BASE_SHA...$PR_SHA"
          elif [[ "$EVENT_NAME" == "push" ]]; then
            if [[ -n "$PUSH_BEFORE" && "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]]; then
              git diff --check "$PUSH_BEFORE...$PUSH_SHA"
            else
              git diff --check HEAD^...HEAD
            fi
          else
            git diff --check HEAD^...HEAD
          fi

      - name: Lint PlantUML sources
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys

          files = sorted(Path("docs").rglob("*.puml"))
          errors = []
          start_pattern = re.compile(r"^\s*@startuml(?:\s+.*)?$")
          enduml_pattern = re.compile(r"^\s*@enduml\s*$")
          open_pattern = re.compile(r"^\s*(alt|opt|loop|par|break|critical|group)\b")
          end_pattern = re.compile(r"^\s*end(?:\s+.*)?$")
          sql_patterns = (
              re.compile(r"\bSELECT\b.*\bFROM\b", re.IGNORECASE),
              re.compile(r"\bINSERT\s+INTO\b", re.IGNORECASE),
              re.compile(r"\bUPDATE\s+[A-Za-z_][\w.]*\s+SET\b", re.IGNORECASE),
              re.compile(r"\bDELETE\s+FROM\b", re.IGNORECASE),
              re.compile(r"\bFOR\s+UPDATE\b", re.IGNORECASE),
          )
          customer_dir = Path("docs/diagrams/customer")

          if not files:
              errors.append("no docs/**/*.puml files found")

          for path in files:
              lines = path.read_text(encoding="utf-8").splitlines()
              starts = [number for number, line in enumerate(lines, 1) if start_pattern.match(line)]
              endumls = [number for number, line in enumerate(lines, 1) if enduml_pattern.match(line)]
              if len(starts) != 1:
                  errors.append(f"{path}: expected exactly one line-anchored @startuml, found {len(starts)}")
              if len(endumls) != 1:
                  errors.append(f"{path}: expected exactly one line-anchored @enduml, found {len(endumls)}")

              blocks = []
              for number, line in enumerate(lines, 1):
                  opening = open_pattern.match(line)
                  if opening:
                      blocks.append((opening.group(1), number))
                  elif re.match(r"^\s*end\s+note\b", line):
                      pass
                  elif end_pattern.match(line):
                      if not blocks:
                          errors.append(f"{path}:{number}: unmatched end")
                      else:
                          blocks.pop()

                  if any(pattern.search(line) for pattern in sql_patterns):
                      errors.append(f"{path}:{number}: SQL-shaped syntax is not allowed")

              for token, number in blocks:
                  errors.append(f"{path}:{number}: unclosed {token} block")

              if path.parent == customer_dir and not path.with_suffix(".png").is_file():
                  errors.append(f"{path}: missing sibling PNG")

          if errors:
              print("\n".join(errors), file=sys.stderr)
              sys.exit(1)
          print(f"Validated {len(files)} PlantUML sources.")
          PY

  gate:
    name: CI / gate
    if: always()
    needs: [changes, be-check, fe-check, docs-check]
    runs-on: ubuntu-latest
    steps:
      - name: Validate required job results
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          BE_RESULT: ${{ needs.be-check.result }}
          FE_RESULT: ${{ needs.fe-check.result }}
          DOCS_RESULT: ${{ needs.docs-check.result }}
        shell: bash
        run: |
          set -euo pipefail
          # Result matrix: success/skipped pass; failure/cancelled/anything else fail.
          for result in "$CHANGES_RESULT" "$BE_RESULT" "$FE_RESULT" "$DOCS_RESULT"; do
            case "$result" in
              success|skipped)
                ;;
              failure|cancelled|*)
                echo "CI gate rejected job result: $result" >&2
                exit 1
                ;;
            esac
          done
          echo "All required CI results are success or skipped."
