name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect changed domains
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            # Workflow-file changes intentionally fan out all domains.
            backend:
              - 'backend/**'
              - 'database/**'
              - 'tests/**'
              - '.github/workflows/**'
            frontend:
              - 'frontend/**'
              - '.github/workflows/**'
            # Docs/Markdown changes intentionally run the full PlantUML corpus lint.
            docs:
              - 'docs/**'
              - 'tools/**'
              - '**/*.md'
              - '.github/workflows/**'

  be-check:
    name: BE / tests & build
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend == 'true'
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and test backend
        working-directory: backend
        run: mvn -B -ntp verify

  fe-check:
    name: FE / build & lint
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.frontend == 'true'
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Node.js 22
        if: hashFiles('frontend/package.json') != '' && hashFiles('frontend/package-lock.json') != ''
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Require frontend lockfile
        if: hashFiles('frontend/package.json') != ''
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f package-lock.json ]]; then
            echo "frontend/package.json exists but frontend/package-lock.json is absent; commit the lockfile and use npm ci." >&2
            exit 1
          fi

      - name: Install frontend dependencies from lockfile
        if: hashFiles('frontend/package.json') != '' && hashFiles('frontend/package-lock.json') != ''
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        if: hashFiles('frontend/package.json') != ''
        working-directory: frontend
        env:
          NPM_SCRIPT: lint
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { spawnSync } = require('node:child_process');

          const script = process.env.NPM_SCRIPT;
          const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          if (!Object.prototype.hasOwnProperty.call(packageJson.scripts ?? {}, script)) {
            console.log(`${script} not configured; skipped`);
            process.exit(0);
          }

          const result = spawnSync('npm', ['run', script], { stdio: 'inherit' });
          process.exit(result.status ?? 1);
          NODE

      - name: Type-check frontend
        if: hashFiles('frontend/package.json') != ''
        working-directory: frontend
        env:
          NPM_SCRIPT: typecheck
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { spawnSync } = require('node:child_process');

          const script = process.env.NPM_SCRIPT;
          const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          if (!Object.prototype.hasOwnProperty.call(packageJson.scripts ?? {}, script)) {
            console.log(`${script} not configured; skipped`);
            process.exit(0);
          }

          const result = spawnSync('npm', ['run', script], { stdio: 'inherit' });
          process.exit(result.status ?? 1);
          NODE

      - name: Build frontend
        if: hashFiles('frontend/package.json') != ''
        working-directory: frontend
        run: npm run build

      - name: Validate frontend placeholder
        if: hashFiles('frontend/package.json') == ''
        shell: bash
        run: |
          set -euo pipefail
          test -f frontend/README.md
          test -d frontend/src
          echo "Frontend toolchain is not present; placeholder README and src directory are valid."

  docs-check:
    name: Docs / lint
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.docs == 'true'
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check changed-file whitespace
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --check "$PR_BASE_SHA...$PR_SHA"
          elif [[ "$EVENT_NAME" == "push" ]]; then
            if [[ -n "$PUSH_BEFORE" && "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]]; then
              git diff --check "$PUSH_BEFORE...$PUSH_SHA"
            else
              git diff --check HEAD^...HEAD
            fi
          else
            git diff --check HEAD^...HEAD
          fi

      - name: Lint PlantUML sources
        run: python3 tools/lint_plantuml.py

  e2e-check:
    name: E2E / PostgreSQL & Playwright
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.frontend == 'true'
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: crm_e2e
          POSTGRES_USER: e2e
          POSTGRES_PASSWORD: e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U e2e -d crm_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      E2E_DATABASE_URL: postgresql://e2e:e2e@localhost:5432/crm_e2e
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run full-stack E2E suite
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload Playwright failure report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-failure-artifacts
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore

  gate:
    name: CI / gate
    if: always()
    needs: [changes, be-check, fe-check, docs-check, e2e-check]
    runs-on: ubuntu-latest
    steps:
      - name: Validate required job results
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          BE_RESULT: ${{ needs.be-check.result }}
          FE_RESULT: ${{ needs.fe-check.result }}
          DOCS_RESULT: ${{ needs.docs-check.result }}
          E2E_RESULT: ${{ needs.e2e-check.result }}
        shell: bash
        run: |
          set -euo pipefail
          # Result matrix: success/skipped pass; failure/cancelled/anything else fail.
          for result in "$CHANGES_RESULT" "$BE_RESULT" "$FE_RESULT" "$DOCS_RESULT" "$E2E_RESULT"; do
            case "$result" in
              success|skipped)
                ;;
              failure|cancelled|*)
                echo "CI gate rejected job result: $result" >&2
                exit 1
                ;;
            esac
          done
          echo "All required CI results are success or skipped."
