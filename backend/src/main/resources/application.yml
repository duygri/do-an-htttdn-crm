spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/htttdn}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC
server:
  port: ${SERVER_PORT:8082}
  error:
    include-message: always
app:
  admin:
    guard-enabled: ${ADMIN_GUARD_ENABLED:false}
  auth:
    jwt-secret: ${JWT_SECRET:dev-only-change-this-secret-to-a-long-random-value}
    access-minutes: ${ACCESS_TOKEN_MINUTES:15}
    refresh-days: ${REFRESH_TOKEN_DAYS:30}
    secure-cookie: ${SECURE_REFRESH_COOKIE:false}
  payos:
    client-id: ${PAYOS_CLIENT_ID:}
    api-key: ${PAYOS_API_KEY:}
    checksum-key: ${PAYOS_CHECKSUM_KEY:}
    return-url: ${PAYOS_RETURN_URL:http://localhost:5173/thanh-toan}
    cancel-url: ${PAYOS_CANCEL_URL:http://localhost:5173/thanh-toan}
