spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/crm}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC
server:
  port: ${SERVER_PORT:8080}
app:
  admin:
    guard-enabled: ${ADMIN_GUARD_ENABLED:false}
