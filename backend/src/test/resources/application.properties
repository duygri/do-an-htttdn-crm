# Synthetic test credentials only; PostgreSQL QA can supply environment credentials.
spring.datasource.password=${DB_PASSWORD:test-database-password}
app.auth.jwt-secret=${JWT_SECRET:unit-test-signing-key-0123456789abcdef0123456789}

# Tests never poll persisted emails or contact a live provider.
EMAIL_OUTBOX_WORKER_ENABLED=false
BREVO_ENABLED=false
