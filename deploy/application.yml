spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 3
      minimum-idle: 0
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
server:
  port: ${PORT:10000}
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never
app:
  request:
    max-body-bytes: ${MAX_BODY_BYTES:1048576}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    per-minute: ${RATE_LIMIT_PER_MINUTE:120}
    auth-max-attempts: ${AUTH_MAX_ATTEMPTS:5}
    auth-window-minutes: ${AUTH_WINDOW_MINUTES:15}
    trust-forwarded-for: ${RATE_LIMIT_TRUST_FORWARDED_FOR:true}
  auth:
    jwt-secret: ${JWT_SECRET}
    access-minutes: 15
    refresh-days: 30
    secure-cookie: true
  payos:
    client-id: ''
    api-key: ''
    checksum-key: ''
    return-url: ${PUBLIC_ORIGIN}/thanh-toan
    cancel-url: ${PUBLIC_ORIGIN}/thanh-toan
PAYOS_AUTO_CANCEL_ENABLED: false
DEV_PASSWORD_RESET_ENABLED: false
CORS_ORIGINS: ${PUBLIC_ORIGIN}
deployment:
  bootstrap-admin:
    enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
